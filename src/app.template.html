<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAILQUEST プロトタイプ v0.1</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#171226">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrailQuest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap">
<style>
  :root{
    --font-px:'Press Start 2P',monospace;
    --font-dot:'DotGothic16',monospace;
    --bg:#171226; --panel:#1d1733; --hud-border:#f0e6d2; --hud-inner:#4a3f78;
    --track:#2c2450; --card:#241d42; --line:#4a3f78;
    --fg:#f3ecd9; --dim:#b6acd6; --dim2:#7c72a3;
    --gold:#e8c25f; --nature:#57b06b; --buzz:#e0607a; --sight:#e8c25f;
    --c1:#d3573a; --c2:#4f8fd6; --c3:#5fa06e;
  }
  *{box-sizing:border-box;border-radius:0!important}
  html,body{margin:0;height:100%;font-family:var(--font-dot);background:var(--bg);color:var(--fg)}
  #wrap{display:flex;height:100%}
  #panel{width:400px;flex:0 0 400px;background:var(--panel);overflow-y:auto;padding:18px 20px}
  #map{flex:1;min-width:0;position:relative;background:#1a1730}
  #divider{flex:0 0 14px;width:14px;position:relative;z-index:400;
    background:repeating-linear-gradient(to bottom,var(--hud-border) 0 8px,var(--hud-inner) 8px 16px),var(--hud-inner);
    box-shadow:3px 0 0 var(--track),-3px 0 0 var(--track)}
  #divider::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);
    transform:translateX(-50%);box-shadow:0 0 6px var(--gold)}
  .title{font-family:var(--font-px);font-size:18px;color:var(--fg);letter-spacing:1px;margin:0 0 4px}
  .title .accent{color:var(--gold)}
  .sub{font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.6}
  label{display:block;font-size:11px;color:var(--dim);margin:16px 0 6px;font-weight:700;letter-spacing:.5px}
  input[type=text]{width:100%;padding:9px 10px;background:var(--track);border:2px solid var(--hud-inner);color:var(--fg);font-family:var(--font-dot);font-size:13px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:var(--track);border:2px solid var(--hud-inner)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:20px;background:var(--gold);border:2px solid var(--hud-border);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:16px;height:20px;background:var(--gold);border:2px solid var(--hud-border);cursor:pointer}
  input[type=range]::-moz-range-track{background:var(--track);height:14px;border:2px solid var(--hud-inner)}
  .row{display:flex;gap:6px}
  .row>*{flex:1}
  button{padding:9px 10px;background:var(--card);border:2px solid var(--hud-inner);color:var(--fg);font-family:var(--font-dot);font-size:12px;cursor:pointer}
  button:hover{border-color:var(--gold)}
  button.on{background:var(--gold);color:#241a08;border-color:var(--hud-border);font-weight:700}
  #go{width:100%;margin-top:18px;padding:13px;background:var(--gold);color:#241a08;font-weight:700;font-size:14px;border:2px solid var(--hud-border)}
  #go:disabled{background:var(--track);color:var(--dim2);cursor:wait;border-color:var(--line)}
  .val{float:right;color:var(--gold);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{flex:0 0 auto;padding:6px 10px;font-size:11px}
  #log{margin-top:14px;font-size:11px;color:var(--dim);white-space:pre-wrap;line-height:1.7;border-top:2px solid var(--line);padding-top:10px;min-height:20px}
  .card{border:2px solid var(--hud-inner);padding:10px 12px;margin-top:10px;cursor:pointer;background:var(--card)}
  .card.tag{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .card.tag:hover{border-color:var(--gold)}
  .card.tag .dot{width:10px;height:10px;flex:0 0 auto}
  .card.tag .nm{font-size:12px;font-weight:700}
  .card.tag .km{margin-left:auto;font-family:var(--font-px);font-size:12px;color:var(--dim)}
  .card.tag .go{color:var(--gold);font-size:11px}
  .card.sel{background:var(--hud-border);padding:5px;cursor:default}
  .card.sel .inner{background:var(--panel);border:3px solid var(--hud-inner);padding:16px}
  .card.sel h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;flex:0 0 auto}
  .card.sel .badge{font-size:9.5px;color:var(--gold);border:2px solid var(--gold);padding:2px 6px}
  .km-big{font-family:var(--font-px);font-size:30px;color:var(--fg);margin:8px 0 4px}
  .km-big .unit{font-family:var(--font-dot);font-size:13px;color:var(--dim);margin-left:4px}
  .meta{font-size:10.5px;color:var(--dim2);line-height:1.7}
  .bars{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .bar-row{display:flex;align-items:center;gap:7px}
  .bar-row .lb{font-size:10px;color:var(--dim);width:50px;flex:0 0 auto}
  .bar-track{flex:1;height:12px;background:var(--track);border:2px solid var(--hud-inner)}
  .bar-fill{height:100%}
  .bar-row .n{font-size:10px;color:var(--fg);width:20px;text-align:right}
  .tag{display:inline-block;background:transparent;border:2px solid var(--line);padding:2px 7px;margin:2px 4px 0 0;font-size:9.5px;color:var(--dim);cursor:pointer}
  .tag:hover{border-color:var(--gold);color:var(--gold)}
  .tag.rw{border-color:var(--gold);color:var(--gold)}
  .actions{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .act{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;border:none;background:none;color:var(--dim);cursor:pointer;text-align:left;text-decoration:none}
  .act::before{content:'';width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid transparent}
  .act.main{color:var(--fg)}
  .act.main::before{border-left-color:var(--gold)}
  .act.ghost{color:var(--dim2)}
  .qrbox{margin-top:10px;padding:12px;background:#fdf8ec;border:3px solid var(--hud-border);text-align:center}
  .qrbox svg{width:min(200px,55vw);height:auto;display:block;margin:0 auto}
  .qrnote{font-size:10px;color:#3a3320;margin-top:8px;line-height:1.6;text-align:left;font-family:var(--font-dot)}
  .qrurl{font-size:9px;color:#6b5f42;word-break:break-all;margin-top:6px;text-align:left}
  .err{color:var(--buzz)}

  .mapbtns{position:absolute;z-index:500;left:10px;bottom:10px;display:flex;background:var(--panel);
    border:2px solid var(--hud-border);box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .mapbtns[hidden]{display:none}
  .dexbtn{display:flex;align-items:center;gap:5px;padding:7px 9px;font-size:11px;flex:0 0 auto;
    border:none;border-right:2px solid var(--hud-inner);background:none;color:var(--dim)}
  .dexbtn:last-child{border-right:none}
  .dexbtn:hover{color:var(--gold);border-color:var(--hud-inner)}
  .dexbtn .dexcount{background:var(--gold);color:#241a08;font-weight:700;padding:1px 6px;font-size:10px}
  .dex-overlay{position:fixed;inset:0;background:rgba(10,8,20,.78);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
  .dex-overlay[hidden]{display:none}
  .dex-frame{background:var(--hud-border);padding:5px;width:min(640px,92vw);max-height:86vh}
  .dex-box{background:var(--panel);border:3px solid var(--hud-inner);display:flex;flex-direction:column;max-height:calc(86vh - 10px)}
  .dex-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--line);flex:0 0 auto}
  .dex-head .t{font-size:14px;font-weight:700;color:var(--gold)}
  .dex-x{background:none;border:2px solid var(--line);color:var(--dim);width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center}
  .dex-sub{padding:10px 18px 0;font-size:11px;color:var(--dim);flex:0 0 auto}
  .dex-grid{overflow-y:auto;padding:14px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
  .dex-item{background:var(--card);border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--dim)}
  .dex-item .th{width:100%;height:70px;object-fit:cover;display:block;background:var(--track)}
  .dex-item .ic2{width:100%;height:70px;display:flex;align-items:center;justify-content:center;background:var(--track)}
  .dex-item .nm2{color:var(--fg);font-weight:700;font-size:10.5px;line-height:1.3}
  .dex-group-title{grid-column:1/-1;font-size:10px;color:var(--dim2);letter-spacing:1px;margin-top:6px}
  .dex-group-title:first-child{margin-top:0}
  .runlog-list{overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
  .runlog-item{background:var(--card);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:5px}
  .runlog-item .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .runlog-item .date{font-size:9.5px;color:var(--dim2)}
  .runlog-item .dist{font-family:var(--font-px);font-size:16px;color:var(--gold);flex:0 0 auto}
  .runlog-item .sub2{font-size:10px;color:var(--dim)}
  .clear-row{margin-top:8px;display:flex;gap:6px}
  .clearbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:2px solid var(--gold);color:var(--gold);padding:8px;font-size:11.5px;font-weight:700}
  .clearbtn:hover{background:var(--gold);color:#241a08}
  .favaddbtn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:2px solid var(--line);color:var(--dim);padding:8px 10px;font-size:11.5px}
  .favaddbtn:hover{border-color:var(--gold);color:var(--gold)}

  .favs-body{overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
  .fav-section-title{font-size:11px;color:var(--dim2);letter-spacing:1px;margin-bottom:8px}
  .fav-routes{display:flex;flex-direction:column;gap:8px}
  .fav-spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .dex-item{position:relative}
  .favstar{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;
    background:rgba(23,18,38,.75);border:2px solid var(--line);color:var(--dim);font-size:12px;line-height:1}
  .favstar.on{color:var(--gold);border-color:var(--gold)}
  .pop-star{display:flex;align-items:center;gap:5px;background:none;border:2px solid var(--line);color:var(--dim);
    padding:3px 8px;font-size:10px;margin-top:4px}
  .pop-star.on{color:var(--gold);border-color:var(--gold)}

  .viewbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:900;
    background:var(--panel);border:2px solid var(--hud-border);display:flex;align-items:center;gap:12px;
    padding:8px 8px 8px 14px;font-size:11px;color:var(--fg);max-width:calc(100% - 40px)}
  .viewbar[hidden]{display:none}
  .viewbar button{padding:5px 10px;font-size:10px;flex:0 0 auto}
  @media(max-width:760px){
    #wrap{flex-direction:column}
    #panel{width:100%;flex:0 0 auto;max-height:52%}
    #map{height:48%}
    #divider{width:100%;height:14px;flex:0 0 14px;
      background:repeating-linear-gradient(to right,var(--hud-border) 0 8px,var(--hud-inner) 8px 16px),var(--hud-inner);
      box-shadow:0 3px 0 var(--track),0 -3px 0 var(--track)}
    #divider::before{left:0;right:0;top:50%;bottom:auto;width:auto;height:2px;transform:translateY(-50%);
      box-shadow:0 0 6px var(--gold)}
  }
  .leaflet-container{background:#1a1730}
  #jswarn{background:#3a1622;border:2px solid var(--buzz);padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.7;color:#ffd9d9}
  #jswarn b{display:block;font-size:13px;margin-bottom:4px;color:#ff9d9d}
  body.ready #jswarn{display:none}
  .tiles{display:flex;gap:0;position:absolute;z-index:500;right:10px;top:10px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4);border:2px solid var(--hud-border)}
  .tiles button{border:0;border-right:2px solid var(--hud-inner);background:var(--panel);font-size:11px;padding:7px 11px;color:var(--dim)}
  .tiles button:last-child{border-right:0}
  .tiles button.on{background:var(--gold);color:#241a08;font-weight:700}
  #map{position:relative}
  .leaflet-control-zoom{border:2px solid var(--hud-border)!important}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--fg)!important;border-radius:0!important}

  .leaflet-tooltip{background:var(--panel)!important;border:2px solid var(--hud-border)!important;color:var(--fg)!important;font-family:var(--font-dot)!important;font-size:11px!important;padding:4px 8px!important;box-shadow:none!important}
  .leaflet-tooltip:before{display:none}

  .leaflet-popup-content-wrapper{background:var(--panel);border:3px solid var(--hud-border);box-shadow:0 4px 0 var(--hud-inner);padding:0}
  .leaflet-popup-content{margin:0!important;width:240px!important;font-family:var(--font-dot);color:var(--fg)}
  .leaflet-popup-tip-container{display:none}
  .leaflet-popup-close-button{color:var(--fg)!important;font-size:16px!important;padding:4px 6px!important}
  .poi-pop{display:flex;flex-direction:column}
  .poi-pop .ph{width:100%;height:120px;object-fit:cover;display:block;background:var(--track)}
  .poi-pop .ic{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:var(--track)}
  .poi-pop .body{padding:10px 12px}
  .poi-pop .nm{font-size:12px;font-weight:700;color:var(--fg);margin-bottom:2px}
  .poi-pop .cat{font-size:10px;color:var(--gold);margin-bottom:6px}
  .poi-pop .ex{font-size:10.5px;color:var(--dim);line-height:1.6;margin-bottom:4px}
  .poi-pop .src{font-size:8.5px;color:var(--dim2)}
  .poi-pop .src a{color:var(--dim2)}
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <div id="jswarn">
      <b>アプリが起動していません</b>
      このページはJavaScriptが動かない状態で開かれています。メールやファイルアプリの
      <b style="display:inline">プレビュー画面</b>ではなく、Safari や Chrome などのブラウザで開き直してください。
    </div>
    <div class="title">TRAIL<span class="accent">QUEST</span></div>
    <div class="sub">OpenStreetMap のデータから、要望に合う周回コースをその場で計算します。地図をクリックすると起点を変更できます。<br>※アルゴリズム検証用。距離は概算です。</div>

    <label>起点 <span class="val" id="ptxt">上野</span></label>
    <div class="chips" id="presets"></div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="addr" placeholder="住所・駅名で検索（例：蔵前）">
      <button style="flex:0 0 60px" id="find">検索</button>
    </div>
    <button id="here" style="width:100%;margin-top:6px">📍 現在地から走る</button>

    <label>走る距離 <span class="val" id="dkm">5.0 km</span></label>
    <input type="range" id="dist" min="1" max="15" step="0.5" value="5">

    <label>どんな雰囲気の道がいい？ <span class="val" id="natv">自然多め</span></label>
    <input type="range" id="nat" min="-1" max="1" step="0.25" value="0.5">
    <div class="meta" style="display:flex;justify-content:space-between"><span>← 人が多い・賑やか</span><span>自然・静か →</span></div>

    <label>名所も通りたい <span class="val" id="sgtv">ふつう</span></label>
    <input type="range" id="sgt" min="0" max="1" step="0.25" value="0.5">

    <label>帰りのご褒美</label>
    <div class="chips" id="rewards"></div>

    <button id="go">▶ コースをさがす</button>
    <div class="row" style="margin-top:8px">
      <button id="diag">接続テスト</button>
      <button id="copyq">クエリをコピー</button>
      <button id="loadbtn">JSONを読み込む</button>
    </div>
    <input type="file" id="loadfile" accept=".json,.osm,application/json" style="display:none">
    <div id="log"></div>
    <div id="cards"></div>
  </div>
  <div id="divider"></div>
  <div id="map">
    <div class="tiles" id="tiles">
      <button data-t="pale" class="on">地図</button>
      <button data-t="photo">航空写真</button>
      <button data-t="osm">詳細</button>
    </div>
    <div class="mapbtns" id="mapbtns">
      <button id="runlogbtn" class="dexbtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>
        記録<span class="dexcount" id="runlogcount">0</span>
      </button>
      <button id="dexbtn" class="dexbtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H12v18H6.5A2.5 2.5 0 0 0 4 22V4.5z"/><path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H12v18h5.5a2.5 2.5 0 0 1 2.5 2V4.5z"/></svg>
        図鑑<span class="dexcount" id="dexcount">0</span>
      </button>
      <button id="favsbtn" class="dexbtn" title="お気に入り" aria-label="お気に入り">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
        <span class="dexcount" id="favscount">0</span>
      </button>
    </div>
    <div class="viewbar" id="viewbar" hidden>
      <span id="viewbarlabel"></span>
      <button id="viewbarclose">今の生成コースに戻る</button>
    </div>
  </div>
</div>

<div id="dex" class="dex-overlay" hidden>
  <div class="dex-frame">
    <div class="dex-box">
      <div class="dex-head">
        <span class="t">名所図鑑</span>
        <button id="dexclose" class="dex-x" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="dex-sub" id="dexsub"></div>
      <div class="dex-grid" id="dexgrid"></div>
    </div>
  </div>
</div>

<div id="runlog" class="dex-overlay" hidden>
  <div class="dex-frame">
    <div class="dex-box">
      <div class="dex-head">
        <span class="t">クエスト記録</span>
        <button id="runlogclose" class="dex-x" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="dex-sub" id="runlogsub"></div>
      <div class="runlog-list" id="runloglist"></div>
    </div>
  </div>
</div>

<div id="favs" class="dex-overlay" hidden>
  <div class="dex-frame">
    <div class="dex-box">
      <div class="dex-head">
        <span class="t">お気に入り</span>
        <button id="favsclose" class="dex-x" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="favs-body" id="favsbody"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function(){
'use strict';
const $ = (id)=>document.getElementById(id);
const COLORS = ['#d3573a','#4f8fd6','#5fa06e'];

// ---------------- Overpass ----------------
const OVERPASS = [
  ['z.overpass-api.de','https://z.overpass-api.de/api/interpreter'],
  ['lz4.overpass-api.de','https://lz4.overpass-api.de/api/interpreter'],
  ['overpass-api.de','https://overpass-api.de/api/interpreter'],
  ['kumi.systems','https://overpass.kumi.systems/api/interpreter'],
  ['private.coffee','https://overpass.private.coffee/api/interpreter'],
  ['VK maps','https://maps.mail.ru/osm/tools/overpass/api/interpreter'],
];
const MIN_ELEMENTS = 200;
let lastGood = null;
const cache = [];

const ROADS = {
  full:   'footway|path|pedestrian|steps|living_street|residential|unclassified|tertiary|tertiary_link|secondary|secondary_link|primary|primary_link|cycleway|track|service|road',
  mid:    'footway|path|pedestrian|living_street|residential|unclassified|tertiary|tertiary_link|secondary|secondary_link|primary|primary_link|cycleway|road',
  coarse: 'pedestrian|living_street|residential|unclassified|tertiary|tertiary_link|secondary|secondary_link|primary|primary_link',
};

function radiusFor(km){ return Math.min(7000, Math.max(1200, km*1000*0.55)); }
function bboxOf(lat,lon,radius){
  const dLat=radius/111320, dLon=radius/(111320*Math.cos(lat*Math.PI/180));
  return [lat-dLat,lon-dLon,lat+dLat,lon+dLon].map(v=>v.toFixed(5)).join(',');
}

function poiFilters(reward, nature){
  const f = [
    'node["leisure"~"^(park|garden)$"]',
    'node["natural"~"^(water|beach|wood)$"]',
    'node["tourism"~"^(viewpoint|attraction|artwork|museum|gallery)$"]',
    'node["historic"]',
    'node["heritage"]',
    'node["man_made"="tower"]',
    'node["amenity"="place_of_worship"]',
    'node["railway"="station"]',
    'way["leisure"~"^(park|garden)$"]',
    'way["natural"~"^(water|wood)$"]',
    'way["landuse"~"^(forest|grass)$"]',
    'way["waterway"="riverbank"]',
    'way["tourism"~"^(viewpoint|attraction|artwork|museum|gallery)$"]',
    'way["historic"]',
    'way["heritage"]',
    'way["man_made"="tower"]',
    'way["amenity"="place_of_worship"]',
  ];
  const rewardFilters = {
    onsen: ['node["amenity"="public_bath"]','node["leisure"="sauna"]','way["amenity"="public_bath"]'],
    cafe:  ['node["amenity"~"^(cafe|ice_cream)$"]','node["shop"~"^(bakery|confectionery)$"]'],
    food:  ['node["amenity"~"^(restaurant|fast_food)$"]'],
    drink: ['node["amenity"~"^(bar|pub)$"]'],
  };
  if(reward && rewardFilters[reward]) f.push(...rewardFilters[reward]);
  if(nature < 0.25 && reward !== 'cafe' && reward !== 'food')
    f.push('node["amenity"~"^(cafe|restaurant)$"]');
  return f;
}

function buildQuery(lat, lon, radius, reward, nature){
  const outer = bboxOf(lat,lon,radius);
  const mid   = bboxOf(lat,lon,Math.min(radius,4500));
  const inner = bboxOf(lat,lon,Math.min(radius,2600));
  const parts = [
    `way["highway"~"^(${ROADS.full})$"]["area"!="yes"](${inner});`,
    radius > 2600 ? `way["highway"~"^(${ROADS.mid})$"]["area"!="yes"](${mid});` : '',
    radius > 4500 ? `way["highway"~"^(${ROADS.coarse})$"]["area"!="yes"](${outer});` : '',
    ...poiFilters(reward, nature).map(f => `${f}(${outer});`),
  ].filter(Boolean);
  return `[out:json][timeout:300];\n(\n  ${parts.join('\n  ')}\n);\nout body center qt;\n>;\nout skel qt;`;
}

async function askOverpass(url, q, timeoutMs){
  const attempts = [
    ()=>fetch(url+'?data='+encodeURIComponent(q), {method:'GET', mode:'cors', credentials:'omit'}),
    ()=>fetch(url, {method:'POST', mode:'cors', credentials:'omit',
      body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}}),
  ];
  let lastErr;
  for(const go of attempts){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs||300000);
    try{
      const res = await Promise.race([go(), new Promise((_,rej)=>ctrl.signal.addEventListener('abort',()=>rej(new Error('時間切れ'))))]);
      clearTimeout(timer);
      if(!res.ok){
        const hint = res.status===429?'（混雑中。1〜2分待つと通ります）':res.status===504?'（サーバー側が時間切れ。距離を短くしてください）':'';
        throw new Error('HTTP '+res.status+hint);
      }
      return await res.json();
    }catch(e){ clearTimeout(timer); lastErr=e; }
  }
  throw lastErr;
}

async function fetchOsmApi(bbox){
  const [s1,w,n,e] = bbox.split(',').map(Number);
  const url = `https://api.openstreetmap.org/api/0.6/map.json?bbox=${w},${s1},${e},${n}`;
  const res = await fetch(url, {mode:'cors', credentials:'omit'});
  if(!res.ok){
    const t = await res.text().catch(()=>'');
    throw new Error('HTTP '+res.status+(/too many nodes|bbox/i.test(t)?'（範囲が広すぎます。距離を短くしてください）':''));
  }
  const j = await res.json();
  return j.elements;
}

async function getData(lat, lon, radius, reward, nature){
  const key = poiFilters(reward, nature).join('|');
  const hit = cache.find(c => c.key === key && c.radius >= radius - 50
    && RC.haversine(c.lat, c.lon, lat, lon) < 150);
  if(hit){ log(`✓ 取得済みのデータを再利用（半径${(hit.radius/1000).toFixed(1)}km・通信なし）`); return hit.els; }

  const fetchRadius = Math.min(7500, Math.ceil(radius * 1.2 / 250) * 250);
  const area = (2*fetchRadius/1000) ** 2;
  log(`半径${(fetchRadius/1000).toFixed(1)}km（約${Math.round(area)}km²）を取得します`);
  log(`目安 ${estimate(area)}。次回から同じ起点なら通信なしで作れます。`);
  await sleep(30);

  const q = buildQuery(lat, lon, fetchRadius, reward, nature);
  const bbox = bboxOf(lat, lon, fetchRadius);
  let sawNet = 0;
  const order = lastGood ? [lastGood, ...OVERPASS.filter(m=>m[1]!==lastGood[1])] : OVERPASS;
  for(const [name,url] of order){
    try{
      const t0=performance.now();
      log(`取得中… ${name}`);
      const j = await askOverpass(url, q);
      const els = j.elements||[];
      if(els.length < MIN_ELEMENTS){
        log(`  △ ${name}: ${els.length}件しか返りませんでした（この地域のデータを持たないミラーの可能性）`);
        continue;
      }
      log(`✓ 取得成功 ${(els.length/1000).toFixed(1)}k要素 / ${((performance.now()-t0)/1000).toFixed(0)}秒（${name}）`);
      cache.push({lat, lon, radius: fetchRadius, key, els});
      lastGood=[name,url];
      return els;
    }catch(e){
      const msg = String(e.message||e);
      if(/Failed to fetch|NetworkError|load failed/i.test(msg)) sawNet++;
      log(`  × ${name}: ${msg}`);
    }
  }
  try{
    log('Overpassが全滅したので OSM本家API を試します…');
    const els = await fetchOsmApi(bbox);
    if(els.length >= MIN_ELEMENTS){
      log(`✓ 取得成功 ${(els.length/1000).toFixed(1)}k要素（api.openstreetmap.org）`);
      cache.push({lat, lon, radius: fetchRadius, key, els});
      return els;
    }
    log(`  △ api.openstreetmap.org: ${els.length}件`);
  }catch(e){ log(`  × api.openstreetmap.org: ${e.message||e}`); }

  throw new Error(sawNet>=3 ? 'BLOCKED' : 'NODATA');
}

function estimate(areaKm2){
  const sec = Math.round(areaKm2 * 2);
  if(sec < 45) return '20〜40秒';
  if(sec < 120) return '1分前後';
  return `${Math.round(sec/60)}〜${Math.round(sec/60)+2}分`;
}

// ---------------- コースの共有（Googleマップ / QR） ----------------
function cumulative(coords){
  const acc=[0];
  for(let i=1;i<coords.length;i++)
    acc.push(acc[i-1] + RC.haversine(coords[i-1][0],coords[i-1][1],coords[i][0],coords[i][1]));
  return acc;
}
function pickWaypoints(c, n){
  const acc = cumulative(c.coords), total = acc[acc.length-1];
  const at = (frac)=>{
    const target = total*frac;
    let lo=0, hi=acc.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(acc[mid]<target) lo=mid+1; else hi=mid; }
    return c.coords[lo];
  };
  const pts=[];
  const slots = c.reward ? n-1 : n;
  for(let k=1;k<=slots;k++) pts.push(at(k/(slots+1)));
  if(c.reward) pts.push([c.reward.lat, c.reward.lon]);
  return pts;
}
const fmt = (p)=>`${(+p[0]).toFixed(5)},${(+p[1]).toFixed(5)}`;
function gmapsUrl(c, wpCount){
  const s0=[state.lat,state.lon];
  const wp = pickWaypoints(c, wpCount).map(fmt).join('|');
  return 'https://www.google.com/maps/dir/?api=1'
    + '&origin=' + fmt(s0) + '&destination=' + fmt(s0)
    + '&travelmode=walking&waypoints=' + encodeURIComponent(wp);
}

// ---------------- 標高・高低差（国土地理院の標高API。無料・APIキー不要） ----------------
/** 経路全体を律儀に1点ずつ問い合わせると距離が長いほどリクエストが膨れるので、
 *  最大30点までに間引く（15kmのコースでも30回で済む） */
function sampleForElevation(coords, maxPoints){
  const n = coords.length;
  if(n<=maxPoints) return coords;
  const step = (n-1)/(maxPoints-1);
  const out=[];
  for(let i=0;i<maxPoints;i++) out.push(coords[Math.round(i*step)]);
  return out;
}
async function fetchElevation(lat, lon){
  try{
    const r = await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lon}&lat=${lat}&outtype=JSON`);
    if(!r.ok) return null;
    const j = await r.json();
    const e = parseFloat(j.elevation);
    return Number.isFinite(e) ? e : null;
  }catch(e){ return null; }
}
/** 獲得標高・下り・標高レンジを返す。データが足りなければnull */
async function computeElevation(c){
  const pts = sampleForElevation(c.coords, 30);
  const elevs = await Promise.all(pts.map(([la,lo])=>fetchElevation(la,lo)));
  const valid = elevs.filter((e)=>e!=null);
  if(valid.length<2) return null;
  let gain=0, loss=0;
  for(let i=1;i<valid.length;i++){
    const d = valid[i]-valid[i-1];
    if(d>0) gain+=d; else loss-=d;
  }
  return { gain:Math.round(gain), loss:Math.round(loss), min:Math.round(Math.min(...valid)), max:Math.round(Math.max(...valid)) };
}
function formatElev(p){
  return p ? `獲得標高 ▲${p.gain}m ▼${p.loss}m（標高${p.min}〜${p.max}m）` : '標高データを取得できませんでした';
}
/** 選択中コースの標高を（未取得なら）取りに行って、取れたらカードに反映する */
function loadElevationFor(i){
  const c = state.courses[i];
  if(!c) return;
  if(c.elevProfile !== undefined){ const el=$('elev'+i); if(el) el.textContent=formatElev(c.elevProfile); return; }
  computeElevation(c).then((p)=>{
    c.elevProfile = p;
    if(state.sel===i){ const el=$('elev'+i); if(el) el.textContent=formatElev(p); }
  });
}

// ---------------- スポットの写真・説明（Wikipedia/Wikidata。無料・APIキー不要） ----------------
const photoCache = new Map();
const escapeHtml = (s)=>String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  leaf: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c8 0 14-6 14-14V5h-2C9 5 3 11 3 19v2z"/><path d="M5 21c3-6 6-9 12-12"/></svg>',
  torii: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18"/><path d="M5 8v13"/><path d="M19 8v13"/><path d="M2 5c3-1.3 6.5-2 10-2s7 .7 10 2"/></svg>',
  cup: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/></svg>',
  drop: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/></svg>',
  building: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>',
};
function catIcon(cat){
  if(['park','water','green','view'].includes(cat)) return {svg:ICONS.leaf, color:BAR.nature};
  if(cat==='sight') return {svg:ICONS.torii, color:BAR.sight};
  if(cat==='onsen') return {svg:ICONS.drop, color:BAR.buzz};
  if(['cafe','sweets','food','drink'].includes(cat)) return {svg:ICONS.cup, color:BAR.buzz};
  return {svg:ICONS.building, color:'#9089b8'};
}

/** 最後の手段：座標から半径100m以内でジオタグ付きのCommons画像を探す。
 *  そのスポットそのものを写した写真とは限らないので「付近の写真」と明記して返す。 */
async function commonsNearby(lat, lon){
  const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch`
    + `&ggscoord=${lat}|${lon}&ggsradius=100&ggslimit=1&ggsnamespace=6`
    + `&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=320&format=json&origin=*`;
  const r = await fetch(url);
  if(!r.ok) return null;
  const j = await r.json();
  const pages = j.query && j.query.pages;
  if(!pages) return null;
  const page = Object.values(pages)[0];
  const info = page && page.imageinfo && page.imageinfo[0];
  if(!info) return null;
  const rawDesc = info.extmetadata && info.extmetadata.ImageDescription && info.extmetadata.ImageDescription.value;
  const extract = rawDesc ? rawDesc.replace(/<[^>]+>/g,'').trim() : null;
  return { img: info.thumburl || info.url, extract, link: info.descriptionurl, src:'Wikimedia Commons（付近の写真）' };
}

/** Wikipedia要約 → だめならWikidataのP18画像 → だめならOSMのimageタグ →
 *  だめなら座標付近のCommons写真、の順で試す。全部無料・APIキー不要 */
async function resolvePhoto(poi){
  const tags = poi.tags||{};
  try{
    if(tags.wikipedia){
      const idx = tags.wikipedia.indexOf(':');
      const lang = idx>0 ? tags.wikipedia.slice(0,idx) : 'ja';
      const title = idx>0 ? tags.wikipedia.slice(idx+1) : tags.wikipedia;
      const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      if(r.ok){
        const j = await r.json();
        if(j.thumbnail || j.extract){
          return { img: j.thumbnail && j.thumbnail.source, extract: j.extract,
            link: j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page, src:'Wikipedia' };
        }
      }
    }
    if(tags.wikidata){
      const r = await fetch(`https://www.wikidata.org/wiki/Special:EntityData/${tags.wikidata}.json`);
      if(r.ok){
        const j = await r.json();
        const ent = j.entities && j.entities[tags.wikidata];
        const claim = ent && ent.claims && ent.claims.P18 && ent.claims.P18[0];
        const file = claim && claim.mainsnak && claim.mainsnak.datavalue && claim.mainsnak.datavalue.value;
        const desc = ent && ent.descriptions && (ent.descriptions.ja || ent.descriptions.en);
        if(file || desc){
          return {
            img: file ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=320` : null,
            extract: desc && desc.value, link:`https://www.wikidata.org/wiki/${tags.wikidata}`, src:'Wikidata',
          };
        }
      }
    }
    if(tags.image){
      const m = /File:(.+)$/.exec(tags.image);
      if(m) return { img:`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(m[1])}?width=320`,
        extract:null, link: tags.image.startsWith('http')?tags.image:null, src:'Wikimedia Commons' };
    }
    const near = await commonsNearby(poi.lat, poi.lon);
    if(near) return near;
  }catch(e){ /* オフライン等。アイコン表示のまま */ }
  return null;
}

function poiPopupHtml(poi, state){ // state: 'loading' | data(object|null after fetch)
  const {svg,color} = catIcon(poi.cat);
  const photo = state && state.img
    ? `<img class="ph" src="${state.img}" alt="${escapeHtml(poi.name||'')}" loading="lazy">`
    : `<div class="ic" style="color:${color}">${svg}</div>`;
  const ex = state==='loading'
    ? `<div class="ex" style="color:var(--dim2)">くわしい情報をさがしています…</div>`
    : state && state.extract
      ? `<div class="ex">${escapeHtml(state.extract.slice(0,90))}${state.extract.length>90?'…':''}</div>`
      : `<div class="ex" style="color:var(--dim2)">写真・説明は見つかりませんでした</div>`;
  const src = state && state.src && state!=='loading'
    ? `<div class="src">出典: ${state.link?`<a href="${state.link}" target="_blank" rel="noopener">${state.src}</a>`:state.src}</div>` : '';
  const dkey = dexKeyFor(poi);
  const known = dex[dkey];
  const star = known
    ? `<button class="pop-star${known.fav?' on':''}" data-favkey="${dkey}">${known.fav?'★':'☆'} お気に入り</button>` : '';
  return `<div class="poi-pop">${photo}<div class="body">
    <div class="nm">${escapeHtml(poi.name||poi.label)}</div>
    <div class="cat">${poi.note?escapeHtml(poi.note)+' ・ ':''}${escapeHtml(poi.label)}</div>
    ${ex}${src}${star}
  </div></div>`;
}

/** マーカーに、写真つきポップアップ（クリック）とホバー用の短いツールチップを付ける。
 *  OSMタグに手がかりが無くても、座標付近のCommons写真を探しに行くので毎回「さがしています…」から始める。 */
function attachPoiPopup(marker, poi){
  marker.bindTooltip(`${poi.note?poi.note+'：':''}${poi.name}${poi.label?'（'+poi.label+'）':''}`);
  const tags = poi.tags||{};
  marker.bindPopup(poiPopupHtml(poi,'loading'), {maxWidth:240,minWidth:220});
  let started=false;
  marker.on('popupopen', async ()=>{
    if(started) return; started=true;
    recordDiscovery(poi);
    const key = tags.wikipedia || tags.wikidata || tags.image || `${poi.lat.toFixed(5)},${poi.lon.toFixed(5)}`;
    let data = photoCache.has(key) ? photoCache.get(key) : undefined;
    if(data===undefined){ data = await resolvePhoto(poi); photoCache.set(key,data); }
    if(data && data.img) updateDexPhoto(poi, data.img);
    marker.setPopupContent(poiPopupHtml(poi,data));
  });
}

const DEX_KEY = 'trailquest_dex_v1';
function loadDex(){ try{ return JSON.parse(localStorage.getItem(DEX_KEY)||'{}'); }catch(e){ return {}; } }
function saveDex(d){ try{ localStorage.setItem(DEX_KEY, JSON.stringify(d)); }catch(e){ /* 保存領域が無い・シークレットモード等。図鑑機能だけ効かなくなる */ } }

const dexKeyFor = (poi)=> poi.osmId || `${poi.lat.toFixed(5)},${poi.lon.toFixed(5)}`;

/** ポップアップを開いた＝そのスポットを「発見」したとみなして記録する */
function recordDiscovery(poi){
  const key = dexKeyFor(poi);
  if(!dex[key]){
    dex[key] = { name: poi.name||poi.label, label: poi.label, cat: poi.cat, img: null, first: Date.now() };
    saveDex(dex);
    updateDexBadge();
  }
}
/** 写真が後から見つかったら、図鑑のサムネイルにも反映する */
function updateDexPhoto(poi, img){
  const key = dexKeyFor(poi);
  if(dex[key] && !dex[key].img){ dex[key].img = img; saveDex(dex); }
}
function updateDexBadge(){ $('dexcount').textContent = Object.keys(dex).length; }

/** ★お気に入りの名所。トグルするだけで、保存先はdex（各エントリのfavフラグ）を使い回す */
function toggleFavSpot(key){
  if(!dex[key]) return;
  dex[key].fav = !dex[key].fav;
  saveDex(dex);
  updateFavBadge();
}
/** ポップアップ・図鑑・お気に入り、どこの★ボタンもここで拾う（クリックした要素自身の見た目を書き換えるだけ） */
document.addEventListener('click', (e)=>{
  const star = e.target.closest('[data-favkey]');
  if(!star) return;
  const key = star.dataset.favkey;
  toggleFavSpot(key);
  const on = !!(dex[key] && dex[key].fav);
  star.classList.toggle('on', on);
  if(star.classList.contains('pop-star')) star.textContent = (on?'★':'☆') + ' お気に入り';
  else star.textContent = on ? '★' : '☆';
});

function dexItemHtml(key, e){
  const {svg,color} = catIcon(e.cat);
  const thumb = e.img
    ? `<img class="th" src="${e.img}" alt="${escapeHtml(e.name)}" loading="lazy">`
    : `<div class="ic2" style="color:${color}">${svg}</div>`;
  return `<div class="dex-item">${thumb}<div class="nm2">${escapeHtml(e.name)}</div>
    <button class="favstar${e.fav?' on':''}" data-favkey="${key}">${e.fav?'★':'☆'}</button></div>`;
}
function renderDex(){
  const entries = Object.entries(dex);
  $('dexsub').textContent = entries.length
    ? `これまでに見つけたスポット：${entries.length}件`
    : 'まだ何も見つけていません。地図のマーカーやタグをクリックすると、ここに記録されていきます。';
  const groups = {};
  entries.sort((a,b)=>b[1].first-a[1].first).forEach(([key,e])=>{ (groups[e.label]=groups[e.label]||[]).push([key,e]); });
  const order = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  $('dexgrid').innerHTML = order.map(label=>{
    const items = groups[label].map(([key,e])=>dexItemHtml(key,e)).join('');
    return `<div class="dex-group-title">${escapeHtml(label)}（${groups[label].length}）</div>${items}`;
  }).join('');
}

/** 一時的にボタンの文字を差し替えて、押した手応えを返す */

  setTimeout(()=>{ btn.innerHTML=prev; btn.disabled=false; }, ms||1500);
}

  }).join('') : '<div class="dex-sub" style="padding:0">まだお気に入りのルートがありません。コースの★ボタンで追加できます。</div>';
  const spotsHtml = favSpots.length ? favSpots.map(([key,e])=>dexItemHtml(key,e)).join('')
    : '<div class="dex-sub" style="padding:0">まだお気に入りの名所がありません。マーカーのポップアップや図鑑の★で登録できます。</div>';
  $('favsbody').innerHTML = `
    <div><div class="fav-section-title">ルート（${favorites.length}）</div><div class="fav-routes">${routesHtml}</div></div>
    <div><div class="fav-section-title">名所（${favSpots.length}）</div><div class="fav-spots">${spotsHtml}</div></div>`;
}
$('favsbtn').onclick = ()=>{ renderFavs(); $('favs').hidden=false; };
$('favsclose').onclick = ()=>{ $('favs').hidden=true; };
$('favs').onclick = (e)=>{ if(e.target.id==='favs') $('favs').hidden=true; };
$('favsbody').onclick = (e)=>{
  const v = e.target.closest('[data-viewfav]');
  if(v){ const entry=favorites.find(x=>x.id===v.dataset.viewfav); if(entry) showSavedRoute(entry); return; }
  const d = e.target.closest('[data-delfav]');
  if(d){ favorites = favorites.filter(x=>x.id!==d.dataset.delfav); saveFavorites(favorites); updateFavBadge(); renderFavs(); }
};
updateFavBadge();

function bar(label, val, max){
  const pct = Math.max(2, Math.min(100, Math.round(val/max*100)));
  const col = label==='しぜん'?BAR.nature:label==='にぎわい'?BAR.buzz:BAR.sight;
  return `<div class="bar-row"><span class="lb">${label}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
    <span class="n">${val}</span></div>`;
}

function render(){
  routeLayer.clearLayers();
  hlMarkers = {};
  const cards=[];
  state.courses.forEach((c,i)=>{
    const col=COLORS[i%3];
    const line=L.polyline(c.coords,{color:col,weight:i===state.sel?7:4,opacity:i===state.sel?0.95:0.4}).addTo(routeLayer);
    line.on('click',()=>select(i));
    if(i===state.sel){
      c.highlights.forEach((h,hi)=>{
        const m = L.circleMarker([h.poi.lat,h.poi.lon],{radius:6,color:'#f0e6d2',weight:2,fillColor:'#4f8fd6',fillOpacity:1})
          .addTo(routeLayer);
        attachPoiPopup(m, h.poi);
        hlMarkers[hi]=m;
      });
      if(c.reward){
        const m = L.circleMarker([c.reward.lat,c.reward.lon],{radius:9,color:'#f0e6d2',weight:3,fillColor:'#e8c25f',fillOpacity:1})
          .addTo(routeLayer);
        attachPoiPopup(m, {...c.reward, note:'ゴール前'});
        hlMarkers.reward=m;
      }
    }

    if(i===state.sel){
      const hl=c.highlights.slice(0,6).map((h,hi)=>`<span class="tag" data-poi="${hi}">${escapeHtml(h.poi.name)}</span>`).join('');
      cards.push(`<div class="card sel" data-i="${i}"><div class="inner">
        <h3><span class="dot" style="background:${col}"></span>コース${i+1}
          <span class="badge">★せんたくちゅう</span></h3>
        <div class="km-big">${(c.total/1000).toFixed(2)}<span class="unit">km</span></div>
        <div class="meta">もくひょうとのズレ ${(c.err*100).toFixed(0)}% ／ かぶり ${(c.overlap*100).toFixed(0)}%</div>
        <div class="meta" id="elev${i}">${c.elevProfile!==undefined ? formatElev(c.elevProfile) : '標高を調べています…'}</div>
        <div class="bars">
          ${bar('しぜん', c.mix.nature, 30)}
          ${bar('にぎわい', c.mix.buzz, 30)}
          ${bar('めいしょ', c.mix.sight, 30)}
        </div>
        <div>${c.reward?`<span class="tag rw" data-poi="reward">♨ ゴール前：${escapeHtml(c.reward.name)}</span>`:''}${hl||'<span class="meta">（名前付きスポットなし）</span>'}</div>
        <div class="actions">
          ${onPhone
            ? `<a class="act main" href="${gmapsUrl(c,3)}" target="_blank" rel="noopener">Googleマップで開く</a>
               <button class="act" data-qr="${i}">QRを表示</button>`
            : `<button class="act main" data-qr="${i}">スマホで開く</button>
               <a class="act" href="${gmapsUrl(c,9)}" target="_blank" rel="noopener">Googleマップで開く</a>`}
          <a class="act ghost" href="#" data-gpx="${i}">GPXを書き出す</a>
        </div>
        <div class="clear-row">
          <button class="favaddbtn" id="favbtn${i}" data-favadd="${i}" title="お気に入りに追加">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.6 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg>
          </button>
          <button class="clearbtn" id="clearbtn${i}" data-clear="${i}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>
            このコースを走った！クリアを記録
          </button>
        </div>
        <div class="qrbox" id="qr${i}" hidden></div>
      </div></div>`);
    }else{
      cards.push(`<div class="card tag" data-i="${i}">
        <span class="dot" style="background:${col}"></span>
        <span class="nm">コース${i+1}</span>
        <span class="km">${(c.total/1000).toFixed(2)}km</span>
        <span class="go">▶選択</span>
      </div>`);
    }
  });
  $('cards').innerHTML=cards.join('');
  loadElevationFor(state.sel);
  const b=L.latLngBounds(state.courses[state.sel].coords); map.fitBounds(b,{padding:[30,30]});
  $('cards').onclick=(e)=>{
    const poiTag=e.target.closest('.tag');
    if(poiTag && poiTag.dataset.poi!=null){ e.preventDefault(); jumpToPoi(poiTag.dataset.poi); return; }
    const clearBtn=e.target.closest('[data-clear]');
    if(clearBtn){ e.preventDefault(); markCleared(+clearBtn.dataset.clear); return; }
    const favBtn=e.target.closest('[data-favadd]');
    if(favBtn){ e.preventDefault(); addFavorite(+favBtn.dataset.favadd); return; }
    const g=e.target.dataset.gpx;
    if(g!=null){ e.preventDefault(); downloadGpx(state.courses[+g],+g); return; }
    const q=e.target.dataset.qr;
    if(q!=null){ e.preventDefault(); toggleQr(+q); return; }
    const card=e.target.closest('.card'); if(card) select(+card.dataset.i);
  };
}
function select(i){ state.sel=i; render(); }

function toggleQr(i){
  const box=$('qr'+i);
  if(!box.hidden){ box.hidden=true; return; }
  const c=state.courses[i];
  const url=gmapsUrl(c,3);
  try{
    const qr=QR.encode(url);
    box.innerHTML = QR.toSvg(qr,{cell:4})
      + `<div class="qrnote">スマホのカメラで読み取ると、Googleマップの徒歩ルートが開きます。<br>
         ※ 経由地はスマホだと3か所までなので、実際に案内される道は多少ずれます。
         正確なコースが必要なときは GPX を使ってください。</div>`
      + `<div class="qrurl">${url}</div>`;
  }catch(err){
    box.innerHTML = `<div class="qrnote">QRを作れませんでした: ${err.message}</div>`;
  }
  box.hidden=false;
}

document.body.classList.add('ready');

function downloadGpx(c,i){
  const pts=c.coords.map(([la,lo])=>`<trkpt lat="${la.toFixed(6)}" lon="${lo.toFixed(6)}"></trkpt>`).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="trailquest-prototype" xmlns="http://www.topografix.com/GPX/1/1">
<metadata><name>${state.name} ${(c.total/1000).toFixed(1)}km</name></metadata>
<trk><name>コース${i+1}${c.reward?' → '+c.reward.name:''}</name><trkseg>
${pts}
</trkseg></trk></gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download=`course_${(c.total/1000).toFixed(1)}km.gpx`; a.click();
}
})();
</script>
</body>
</html>
